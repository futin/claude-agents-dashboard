# The CI gate for every PR into main (docs/workflows/ci.md). The job id must stay `ci` and no job may set `name:` — the ruleset requires the contexts
# `ci / checks`, `ci / pr-title` and `ci / skills` by exactly those names.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: futin/release-kit/.github/workflows/ci-node.yml@v1
    with:
      kit-ref: v1
      # A feat|fix|perf PR fails `ci / pr-title` while its What's new section is empty; `None` on its own line opts out.
      require-notes: true
      # One command that picks what the PR's diff can break (docs/workflows/ci.md §Scoped checks): a docs-only PR runs the suites that read the changed
      # docs and skips typecheck and build; anything else — and every push to main — runs `pnpm typecheck`, `pnpm build` and `pnpm test`. The scope is
      # decided inside the step from the diff alone, never by skipping the job, so an `edited` re-run reaches the same verdict.
      check-commands: |
        pnpm exec tsx scripts/ci-scope.ts
      skills-command: pnpm test:skills
      skills-paths: plugin/skills/git-sync/**
