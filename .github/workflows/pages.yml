name: Deploy published-guides to Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/published-guides/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload docs/published-guides/ as the site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/published-guides

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v5