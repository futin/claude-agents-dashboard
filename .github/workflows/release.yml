# Each night, cuts one rollup tag for every feat|fix|perf PR merged to main since the last tag and publishes its GitHub Release (docs/workflows/ci.md
# §Releases). The tag is the record: the version
# lives in the annotated `vX.Y.Z` tag message and nowhere else (design D3), so there is no file to bump and nothing to commit back to main.
# The caller keeps both permissions — setting `contents` alone drops `pull-requests` to none and the PR lookup then fails on a private repo — and
# `kit-ref` must equal the `@` ref on `uses:`.
name: release

on:
  # 04:17 UTC, so the night's version is waiting in the morning. Off the hour on purpose: GitHub delays and drops scheduled runs under the top-of-hour
  # load, and the 04:00 schedule never fired once. A dispatch releases on demand; the concurrency group below keeps the two from overlapping.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: The commit to release up to (a re-run of a missed or failed release); the branch head when empty
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: read

# Not cancelled: a run releases the whole range since the last tag, but cancelling one mid-push could leave a tag without its Release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: futin/release-kit/.github/workflows/release.yml@v1
    with:
      sha: ${{ inputs.sha }}
      kit-ref: v1
      mode: rollup
