<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<!-- iOS/Android text auto-detection off. The account popover shows a bare first
     name, a single-letter avatar and plan tags like "Max 5x"; mobile Safari
     linkified some of those as phone numbers/dates and underlined them, which
     reads as clickable. Nothing in this UI wants a detector-made link. -->
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>Claude Dashboard</title>
<!-- The UI face. Hanken Grotesk is the free stand-in for the geometric grotesque
     the reference design is drawn in (.claude/DESIGN.md §1); every weight the
     sheet uses is requested here and nothing else is. `display=swap` so a slow
     or blocked font never holds the first paint — the stack in --font falls
     back to the platform sans, which is what an offline tailnet load gets. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- The compact mark (design handoff "1h"): an ink tile, a green chevron and
     cursor. Paths, not a <text>, so it draws the same with no font loaded. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23141414'/%3E%3Cpath d='M10.5 12.5L14.5 16L10.5 19.5' fill='none' stroke='%236cc04a' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Crect x='17' y='9.8' width='5.3' height='12.4' rx='.9' fill='%236cc04a'/%3E%3C/svg%3E">
<script>
// Stamp the saved theme before first paint. Without this every load renders in
// the default palette until React mounts, which reads as a flash — worst on the
// light theme. Kept inline and tiny on purpose: it must run before the stylesheet
// paints, so it cannot be a module. Mirrors hooks/useSettings.tsx; fails silently
// (private mode, no storage) straight back to the defaults.
try {
  var s = JSON.parse(localStorage.getItem('dashboard.settings') || '{}');
  var r = document.documentElement;
  if (s.theme) r.dataset.theme = s.theme;
  if (s.density) r.dataset.density = s.density;
  if (s.contentWidth) r.dataset.width = s.contentWidth;
  if (s.fontScale) r.style.setProperty('--font-scale', String(s.fontScale / 100));
} catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
