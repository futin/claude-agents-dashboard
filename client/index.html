<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Claude Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1210'/%3E%3Ctext x='16' y='22.5' font-family='Menlo,monospace' font-size='16' font-weight='700' fill='%2355d0dd' text-anchor='middle'%3E%3E_%3C/text%3E%3C/svg%3E">
<script>
// Stamp the saved theme before first paint. Without this every load renders in
// the default palette until React mounts, which reads as a flash — worst on the
// light theme. Kept inline and tiny on purpose: it must run before the stylesheet
// paints, so it cannot be a module. Mirrors hooks/useSettings.tsx; fails silently
// (private mode, no storage) straight back to the defaults.
try {
  var s = JSON.parse(localStorage.getItem('dashboard.settings') || '{}');
  var r = document.documentElement;
  if (s.theme) r.dataset.theme = s.theme;
  if (s.density) r.dataset.density = s.density;
  if (s.fontScale) r.style.setProperty('--font-scale', String(s.fontScale / 100));
} catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
